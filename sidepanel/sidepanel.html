<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyPilot AI — Companion</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Inline status messaging (replaces blocking alert() dialogs) -->
  <div id="sp-status-banner" role="status" aria-live="polite"
       style="display:none;padding:8px 10px;border-radius:6px;font-size:12px;margin:8px;"></div>
  <div class="sp-container">
    <!-- Header -->
    <header class="sp-header">
      <div class="sp-brand">
        <div class="sp-logo">
          <svg viewBox="0 0 24 24">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h2 class="sp-title">ApplyPilot <span class="sp-badge-ai">Companion</span></h2>
          <p class="sp-subtitle">Universal Application Copilot</p>
        </div>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="sp-btn-refresh" id="sp-btn-export-logs" title="Export Application Activity Log (JSON)">📋</button>
        <button class="sp-btn-refresh" id="sp-btn-refresh" title="Rescan Page">🔄</button>
      </div>
    </header>

    <!-- Main Action Bar -->
    <div class="sp-action-banner">
      <button class="sp-primary-btn" id="sp-autofill-btn">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Autofill This Page
      </button>
      <button class="sp-secondary-btn" id="sp-capture-btn" title="Capture & learn any fields entered or pre-filled on this page">
        📥 Learn Page
      </button>
      <button class="sp-secondary-btn" id="sp-scan-ai-btn">
        ⚡ Review Unmatched
      </button>
    </div>

    <!-- Live Form Detection Status -->
    <section class="sp-section">
      <div class="sp-section-header">
        <h3>Page Form Status</h3>
        <span class="sp-status-badge" id="sp-status-badge">Scanning...</span>
      </div>
      <div class="sp-status-card" id="sp-status-card">
        <div class="sp-stat-item">
          <span class="sp-stat-val" id="sp-stat-total">0</span>
          <span class="sp-stat-lbl">Fields Found</span>
        </div>
        <div class="sp-stat-item">
          <span class="sp-stat-val sp-text-success" id="sp-stat-matched">0</span>
          <span class="sp-stat-lbl">Recognized</span>
        </div>
        <div class="sp-stat-item">
          <span class="sp-stat-val sp-text-warn" id="sp-stat-unmatched">0</span>
          <span class="sp-stat-lbl">Unmapped</span>
        </div>
      </div>
    </section>

    <!-- Offline Smart Answer Builder -->
    <section class="sp-section">
      <div class="sp-section-header">
        <h3>⚡ Smart Answer Builder</h3>
      </div>
      <div class="sp-card">
        <label class="sp-label">Application Question / Prompt:</label>
        <input type="text" id="sp-ai-prompt" class="sp-input" placeholder="e.g. Why do you want to work at [Company]?">
        
        <div class="sp-flex-row" style="margin-top: 8px;">
          <button class="sp-secondary-btn sp-flex-1" id="sp-btn-generate-essay">
            ⚡ Draft Answer
          </button>
        </div>

        <div id="sp-ai-result-box" style="margin-top: 10px; display: none;">
          <label class="sp-label">Drafted Answer (Personalized from Profile):</label>
          <textarea id="sp-ai-result" class="sp-textarea" rows="4"></textarea>
          <div class="sp-flex-row" style="margin-top: 6px;">
            <button class="sp-secondary-btn sp-flex-1" id="sp-btn-copy-essay">📋 Copy</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Quick Copy Drawer -->
    <section class="sp-section sp-flex-1">
      <div class="sp-section-header">
        <h3>📋 Quick-Copy Field Drawer</h3>
        <span class="sp-text-muted" style="font-size: 11px;">Click to copy any detail</span>
      </div>
      <div class="sp-drawer-list" id="sp-drawer-list">
        <!-- Populated dynamically from profile -->
      </div>
    </section>

    <!-- Creator Branding Footer -->
    <footer style="margin-top: 12px; padding: 10px 0 4px 0; border-top: 1px solid var(--border, #e2e8f0); text-align: center; font-size: 10px; color: var(--text-muted, #64748b);">
      ApplyPilot AI &bull; Created by <a href="https://pritamrauniyar.com.np/" target="_blank" style="color: var(--primary, #4f46e5); text-decoration: none; font-weight: 600;">Pritam Rauniyar ↗</a>
    </footer>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/audit-logger.js"></script>
  <script src="../lib/deterministic-resume-parser.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
